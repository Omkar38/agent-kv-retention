name: Group 9 Week 4 extended research evaluation

on:
  push:
    branches: [Hangting_week4]
    paths:
      - "week4/**"
      - "week4_handoff.py"
      - ".github/workflows/week4_extended.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: week4/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r week4/requirements.txt
      - name: Run all model and audit unit tests
        run: python -m unittest discover -s week4/tests -p 'test_*.py' -v
      - name: Recompute original prediction exports on canonical trace
        run: python week4_handoff.py --input analysis/dataset/pause_handoff.parquet --output-dir results/week4_handoff --seed 560 --max-train 80000 --iterations 75 --break-even-s 1.0
      - name: Compute extended held-out diagnostics and full research report
        run: python -m week4.extended_analysis --dataset analysis/dataset/pause_handoff.parquet --predictions results/week4_handoff/predictions_test.csv --out results/week4_extended --seed 560 --bootstrap 2000 --max-train 80000 --iterations 75
      - name: Commit aggregate results if branch has not advanced
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/week4_extended/
          if git diff --cached --quiet; then
            echo "Aggregate results already match checked-out commit."
            exit 0
          fi
          # Do not overwrite or rebase over concurrent human/team commits.
          # All generated results are still preserved in the artifact below.
          git fetch origin Hangting_week4
          if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::Branch advanced during analysis; skipping auto-push. Download the aggregate artifact if the latest branch does not already contain the results."
            exit 0
          fi
          git commit -m "Add Week 4 extended real-trace analysis and report"
          if ! git push origin HEAD:Hangting_week4; then
            echo "::warning::Another update raced with the results push; results remain in the workflow artifact."
          fi
      - name: Archive only aggregate research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week4-extended-aggregate
          path: results/week4_extended/
          if-no-files-found: ignore
